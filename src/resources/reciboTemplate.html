<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f7f7f7;
        }
        .container {
            max-width: 600px;
            margin: 20px auto;
            background-color: #ffffff;
            padding: 20px;
            border: 1px solid #dddddd;
        }
        .header, .footer {
            text-align: center;
            padding: 10px 0;
        }
        .header {
            font-size: 18px;
            font-weight: bold;
        }
        .content {
            margin: 20px 0;
        }
        .content p {
            line-height: 1.5;
            margin: 10px 0;
        }
        .content .highlight {
            font-weight: bold;
            font-size: 24px;
        }
        .content .dte-number {
            color: #006fee;
            text-decoration: none;
        }
        .footer {
            font-size: 12px;
            color: #555555;
        }
        .footer a {
            color: #006fee;
            text-decoration: none;
        }
        img {
            width: 124px;
            height: 124px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            Estimado(a) cliente/a
        </div>
        <div class="content">
            <p class="highlight">$cliente</p>
            <p>Por este medio adjuntamos su recibo Nro.
                <span class="dte-number">$reciboId</span>
                correspondiente a su operación/transacción.
            </p>
        </div>
        <div class="footer">
            <p>Por favor no responder este mail, corresponde a un proceso automÃ¡tico de facturas.</p>
            <p>Ante consultas o dudas escribinos a:
                <a href="mailto:$emailEmpresa">$emailEmpresa</a>
            </p>
            <img src="https://simplifika.lat/factyble.webp" alt="eFactura Dynamus">
            <p><a href="https://factyble.simplifika.lat">factyble.simplifika.lat</a></p>
        </div>
    </div>
</body>
</html>
